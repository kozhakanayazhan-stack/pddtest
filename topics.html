<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ПДД Курс</title><link rel="stylesheet" href="style.css"></head><body>
<header><b id="hd"></b><span class="hr"><span id="lg"></span><button id="back"></button></span></header>
<main><h2 id="h" style="margin-top:0"></h2><div id="list"></div></main>
<script src="common.js"></script><script>
const D={kk:{h:'Тақырыптар',back:'Басты бет',q:' сұрақ',done:'Өтілді'},ru:{h:'Темы',back:'Главная',q:' вопросов',done:'Пройдено'}};
const $=id=>document.getElementById(id);
async function load(){
  const t=D[LANG];$('h').textContent=t.h;$('back').textContent=t.back;$('back').onclick=()=>location.href='/app.html';
  const d=await api('/api/test/info?lang='+LANG);$('list').innerHTML='';
  d.topics.forEach(x=>{const b=document.createElement('button');b.className='alt';b.style.cssText='display:block;width:100%;text-align:left;margin-bottom:8px;padding:14px';b.innerHTML='<b></b><br><small></small>';
    b.children[0].textContent=x.n+'. '+x.title;
    b.children[2].textContent=x.count+t.q+(x.best!=null?' · '+(x.best>=80?'✓ '+t.done+' ':'')+x.best+'%':'');
    b.onclick=()=>location.href='/topic.html?n='+x.n;$('list').appendChild(b)});
}
langBar($('lg'),load);load().catch(()=>location.href='/');
</script></body></html>
